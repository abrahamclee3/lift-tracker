<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lift Tracker">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Lift%20Tracker%22%2C%22short_name%22%3A%22Lift%20Tracker%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">
    <title>Lift Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-transition {
            transition: all 0.2s ease-in-out;
        }
        
        .btn-transition:active {
            transform: scale(0.97);
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col bg-gray-200">

    <div class="w-full max-w-md mx-auto bg-gray-100 h-[100dvh] flex flex-col relative shadow-xl sm:border-x border-gray-200">
        
        <!-- Header -->
        <header class="bg-white px-4 py-3.5 shadow-sm sticky top-0 z-20 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" id="back-btn" class="hidden text-gray-500 hover:text-gray-800 p-1.5 -ml-1.5 rounded-lg btn-transition shrink-0" aria-label="Back to workouts">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <div id="header-brand" class="flex items-center gap-2.5 min-w-0 cursor-pointer group" title="Your Workouts">
                    <img id="header-icon" src="./apple-touch-icon.png" alt="Lift Tracker Logo" class="w-9 h-9 rounded-xl shadow-xs transition-all shrink-0 object-cover">
                    <div id="header-title-container" class="flex items-center gap-2 min-w-0">
                        <h1 id="header-title" class="text-xl font-bold tracking-tight text-gray-900 truncate">Lift Tracker</h1>
                        <i id="header-edit-icon" class="fa-solid fa-pen text-xs text-gray-400 hidden group-hover:text-indigo-600 transition-colors shrink-0"></i>
                        <span id="offline-badge" class="hidden text-[10px] font-bold uppercase tracking-wide bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full shrink-0">Offline</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" id="header-timer-btn" class="hidden text-gray-500 hover:text-indigo-600 w-9 h-9 rounded-xl btn-transition flex items-center justify-center bg-gray-50" title="Rest Timer" aria-label="Rest Timer">
                    <i class="fa-solid fa-stopwatch text-lg"></i>
                </button>
                <button type="button" id="header-action-btn" class="text-sm text-indigo-600 hover:text-indigo-800 font-semibold btn-transition px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100">
                    <i class="fa-solid fa-plus mr-1"></i> New
                </button>
                <div id="more-menu-wrapper" class="relative">
                    <button type="button" id="more-menu-btn" class="text-gray-500 hover:text-gray-800 hover:bg-gray-100 w-9 h-9 rounded-xl btn-transition flex items-center justify-center" title="Data & Backup" aria-label="More Options">
                        <i class="fa-solid fa-ellipsis-vertical text-base"></i>
                    </button>
                    <div id="more-menu-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 py-1.5 z-50">
                        <button type="button" id="export-btn" class="w-full px-4 py-2.5 text-left text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2.5 transition-colors">
                            <i class="fa-solid fa-file-export w-4 text-center text-gray-400"></i>
                            <span>Export All Data</span>
                        </button>
                        <button type="button" id="import-btn" class="w-full px-4 py-2.5 text-left text-sm font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2.5 transition-colors">
                            <i class="fa-solid fa-file-import w-4 text-center text-gray-400"></i>
                            <span>Import Data</span>
                        </button>
                        <div class="my-1 border-t border-gray-100"></div>
                        <button type="button" id="refresh-offline-btn" class="w-full px-4 py-2 text-left text-[11px] font-medium text-gray-500 hover:bg-gray-50 flex items-center gap-2 transition-colors">
                            <span id="offline-status-dot" class="w-2 h-2 rounded-full bg-gray-300 shrink-0"></span>
                            <span id="offline-status-text">Checking offline cache...</span>
                        </button>
                    </div>
                </div>
                <input type="file" id="import-file-input" accept=".json,application/json" class="hidden">
            </div>
        </header>

        <!-- Top Segmented Navigation Tabs -->
        <div id="top-tabs-bar" class="bg-white border-b border-gray-200 px-4 py-2 shrink-0 z-10">
            <div class="grid grid-cols-2 gap-1.5 bg-gray-100 p-1 rounded-xl">
                <button type="button" id="tab-workouts-btn" class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-white text-indigo-600 shadow-xs text-xs font-semibold btn-transition">
                    <i class="fa-solid fa-dumbbell text-xs"></i>
                    <span>Workouts</span>
                </button>
                <button type="button" id="tab-exercises-btn" class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-gray-500 hover:text-gray-800 text-xs font-medium btn-transition">
                    <i class="fa-solid fa-chart-simple text-xs"></i>
                    <span>Exercises</span>
                </button>
            </div>
        </div>

        <!-- Main View Area -->
        <div class="flex-1 relative overflow-hidden">
            <!-- 1. Workouts History View -->
            <div id="history-view" class="h-full overflow-y-auto p-4 pb-28">
                <div class="flex justify-between items-center gap-2 mb-3">
                    <h2 class="text-lg font-bold text-gray-700">Your Workouts</h2>
                    <div class="flex items-center gap-1.5">
                        <button type="button" id="select-all-btn" class="hidden text-xs font-semibold text-indigo-600 hover:text-indigo-800 px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 btn-transition">Select All</button>
                        <button type="button" id="toggle-select-mode-btn" class="hidden text-xs font-semibold text-gray-600 hover:text-indigo-600 px-3 py-1.5 rounded-lg bg-white border border-gray-200 hover:border-indigo-300 shadow-xs btn-transition">Select</button>
                    </div>
                </div>
                
                <div id="history-empty-state" class="hidden flex flex-col items-center justify-center mt-12 text-center px-4">
                    <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl">
                        <i class="fa-regular fa-calendar"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">No workouts yet</h2>
                    <p class="text-sm text-gray-500">Tap "New" in the top right to start tracking.</p>
                </div>

                <div id="workouts-list" class="space-y-3"></div>
            </div>

            <!-- Sticky Multi-Select Action Bar -->
            <div id="selection-action-bar" class="hidden absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 pt-3 pb-12 shadow-lg z-20 flex items-center justify-between gap-2">
                <span id="selected-count-label" class="text-sm font-semibold text-gray-700">0 selected</span>
                <div class="flex items-center gap-2">
                    <button type="button" id="export-selected-btn" disabled class="px-3.5 py-2 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl btn-transition flex items-center gap-1.5 disabled:opacity-40 disabled:pointer-events-none">
                        <i class="fa-solid fa-file-export"></i> Export
                    </button>
                    <button type="button" id="delete-selected-btn" disabled class="px-3.5 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-xl btn-transition shadow-sm flex items-center gap-1.5 disabled:opacity-40 disabled:pointer-events-none">
                        <i class="fa-solid fa-trash-can"></i> Delete
                    </button>
                </div>
            </div>

            <!-- 2. Workout View -->
            <div id="workout-view" class="absolute inset-0 flex flex-col bg-gray-100 hidden z-10">
                <main class="flex-1 p-4 pb-28 overflow-y-auto">
                    <div id="workout-empty-state" class="hidden flex flex-col items-center justify-center mt-12 text-center px-4">
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center mb-4 text-gray-400 text-2xl">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                        <h2 class="text-lg font-semibold text-gray-700 mb-2">Workout empty</h2>
                        <p class="text-sm text-gray-500">Add an exercise below to begin.</p>
                    </div>
                    <div id="lifts-container" class="space-y-5"></div>
                </main>

                <div class="bg-white border-t border-gray-200 px-4 pt-3 pb-12 sticky bottom-0">
                    <form id="add-lift-form" class="flex gap-2 relative">
                        <ul id="autocomplete-list" class="hidden absolute bottom-full left-0 right-0 mb-2 bg-white border border-gray-200 rounded-xl shadow-lg max-h-48 overflow-y-auto z-50 divide-y divide-gray-100"></ul>
                        <input type="text" id="new-lift-name" placeholder="e.g. Squat, Treadmill..." class="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-base placeholder-gray-400 focus:bg-white transition-colors" autocomplete="off" required>
                        <button type="submit" class="bg-indigo-600 text-white rounded-xl px-5 py-3 font-semibold shadow-md shadow-indigo-200 btn-transition flex items-center justify-center" aria-label="Add Exercise">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 3. Exercise History View -->
            <div id="exercise-history-view" class="hidden absolute inset-0 overflow-y-auto p-4 pb-28">
                <div class="flex justify-between items-center gap-2 mb-3">
                    <h2 class="text-lg font-bold text-gray-700 truncate">Exercise History</h2>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" id="toggle-expand-all-exercises-btn" class="hidden text-xs font-semibold text-gray-600 hover:text-indigo-600 px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 hover:border-indigo-300 shadow-xs btn-transition">Expand All</button>
                        <button type="button" id="select-all-exercises-btn" class="hidden text-xs font-semibold text-indigo-600 hover:text-indigo-800 px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 btn-transition">Select All</button>
                        <button type="button" id="toggle-exercise-select-mode-btn" class="hidden text-xs font-semibold text-gray-600 hover:text-indigo-600 px-3 py-1.5 rounded-lg bg-white border border-gray-200 hover:border-indigo-300 shadow-xs btn-transition">Select</button>
                    </div>
                </div>

                <div id="exercise-search-container" class="hidden relative mb-4">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm absolute left-3.5 top-1/2 -translate-y-1/2 pointer
